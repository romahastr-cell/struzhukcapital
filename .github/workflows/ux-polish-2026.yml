name: Apply 2026 UX polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-polish-2026.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX polish and calculator fixes
        run: python .github/scripts/ux_polish.py
      - name: Commit polish
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Polish 2026 motion UX and fix calculator edge cases"
          git push
